<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Voice capture">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Voice capture</title>
<style>
  :root { --paper:#F4F1EA; --card:#FBFAF6; --ink:#1C1B19; --ink2:#5E5A53; --ink3:#9A958C; --line:#E3DED3; --red:#D9381E; --ok:#3F7D4E; --warn:#B7791F; --ease:cubic-bezier(.2,0,0,1); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { font:16px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif; min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); -webkit-user-select:none; user-select:none; }
  .wrap { max-width:560px; margin:0 auto; padding:0 18px 40px; }
  header { display:flex; align-items:center; gap:10px; padding:14px 0 6px; }
  header h1 { font-size:17px; font-weight:600; margin:0; flex:1; letter-spacing:-.01em; white-space:nowrap; }
  .chip { font-size:13px; font-weight:500; color:var(--ink2); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 11px; max-width:46vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip.ok::before { content:""; display:inline-block; width:7px; height:7px; border-radius:4px; background:var(--ok); margin-right:7px; vertical-align:1px; }
  .chip.off::before { content:""; display:inline-block; width:7px; height:7px; border-radius:4px; background:var(--ink3); margin-right:7px; vertical-align:1px; }
  .icon-btn { width:44px; height:44px; border:0; background:transparent; border-radius:22px; display:grid; place-items:center; color:var(--ink); }
  .notice { display:none; margin:8px 0 0; padding:11px 14px; border-radius:12px; background:var(--ink); color:var(--paper); font-size:14px; line-height:1.4; }
  .notice.on { display:flex; gap:10px; align-items:flex-start; }
  .notice span { flex:1; }
  .notice button { background:transparent; border:0; color:var(--paper); font-size:14px; font-weight:600; padding:0 0 0 6px; }
  .stage { display:flex; flex-direction:column; align-items:center; padding:34px 0 22px; }
  .timer { font-size:52px; font-weight:300; letter-spacing:-.02em; font-variant-numeric:tabular-nums; height:64px; }
  .timer.idle { font-size:17px; font-weight:500; color:var(--ink2); padding-top:22px; letter-spacing:0; }
  .rec-wrap { position:relative; width:200px; height:200px; margin:18px 0 10px; display:grid; place-items:center; }
  .ring { position:absolute; inset:14px; border-radius:50%; border:2px solid var(--line); transition:transform .08s linear, border-color .3s var(--ease); }
  .recording .ring { border-color:rgba(217,56,30,.45); }
  .rec { position:relative; width:148px; height:148px; border-radius:50%; border:0; background:var(--red); box-shadow:0 10px 30px -12px rgba(217,56,30,.7); display:grid; place-items:center; transition:transform .15s var(--ease); touch-action:manipulation; }
  .rec:active { transform:scale(.96); }
  .rec i { display:block; width:40px; height:40px; border-radius:50%; background:#fff; opacity:.95; transition:all .25s var(--ease); }
  .recording .rec i { border-radius:8px; width:46px; height:46px; }
  .rec:disabled { opacity:.5; }
  .sub { font-size:14px; color:var(--ink2); min-height:20px; text-align:center; max-width:320px; }
  h2 { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); margin:18px 0 10px; display:flex; justify-content:space-between; align-items:center; }
  h2 button { font:600 13px -apple-system, system-ui, sans-serif; letter-spacing:0; text-transform:none; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 12px; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 12px 10px 14px; }
  .item .top { display:flex; align-items:center; gap:10px; }
  .item .name { flex:1; font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:12px; font-weight:600; padding:3px 8px; border-radius:10px; white-space:nowrap; }
  .b-up { color:var(--ok); background:#E6EFE3; } .b-wait { color:var(--warn); background:#F6ECD9; } .b-err { color:#A33; background:#F5E1DD; } .b-go { color:var(--ink); background:#ECE8DF; }
  .meta { font-size:13px; color:var(--ink2); margin-top:3px; }
  .bar { height:3px; background:var(--line); border-radius:2px; margin-top:8px; overflow:hidden; display:none; }
  .bar i { display:block; height:100%; width:0; background:var(--ink); transition:width .2s linear; }
  .acts { display:flex; gap:8px; margin-top:9px; flex-wrap:wrap; }
  .acts button, .acts a { font:500 13px -apple-system, system-ui, sans-serif; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:14px; padding:6px 11px; text-decoration:none; min-height:32px; }
  audio { width:100%; margin-top:8px; height:36px; }
  .empty { color:var(--ink3); font-size:14px; padding:8px 2px; }
  .sheet-bg { position:fixed; inset:0; background:rgba(28,27,25,.28); opacity:0; pointer-events:none; transition:opacity .25s var(--ease); z-index:10; }
  .sheet-bg.on { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:11; background:var(--card); border-radius:18px 18px 0 0; padding:10px 18px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; transform:translateY(105%); transition:transform .28s var(--ease); max-width:560px; margin:0 auto; -webkit-user-select:text; user-select:text; }
  .sheet.on { transform:none; }
  .grab { width:36px; height:5px; border-radius:3px; background:#D8D2C6; margin:0 auto 12px; }
  .sheet h3 { font-size:19px; margin:2px 0 14px; }
  .field { margin:0 0 14px; }
  .field label { display:block; font-size:13px; font-weight:600; color:var(--ink2); margin-bottom:6px; }
  .field input[type=text] { width:100%; height:44px; border-radius:12px; border:1px solid var(--line); background:#fff; font-size:16px; padding:0 12px; color:var(--ink); }
  .field .help { font-size:12.5px; color:var(--ink3); margin-top:5px; }
  .seg { display:flex; background:#ECE8DF; border-radius:12px; padding:3px; }
  .seg button { flex:1; min-height:38px; border:0; border-radius:9px; background:transparent; font:500 14px -apple-system, system-ui, sans-serif; color:var(--ink2); }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .btn { display:block; width:100%; height:50px; border-radius:25px; border:1px solid var(--line); background:#fff; font:600 16px -apple-system, system-ui, sans-serif; color:var(--ink); margin-top:10px; }
  .btn.primary { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn.danger { color:#A33; }
  .small { font-size:12.5px; color:var(--ink3); margin-top:14px; line-height:1.5; }
  .tabs { display:flex; background:#ECE8DF; border-radius:12px; padding:3px; margin:6px 0 0; }
  .tabs button { flex:1; min-height:38px; border:0; border-radius:9px; background:transparent; font:600 14px -apple-system, system-ui, sans-serif; color:var(--ink2); }
  .tabs button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .tab { display:none; } .tab.on { display:block; }
  .lib-note { font-size:14px; color:var(--ink2); padding:14px 2px 4px; line-height:1.45; }
  .lib-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; font-size:14px; line-height:1.45; color:var(--ink2); }
  .lib-card b { color:var(--ink); }
  .item.tap { cursor:pointer; }
  .b-ready { color:#2F5D8A; background:#E1EAF3; }
  .b-video { color:var(--ok); background:#E6EFE3; }
  /* wide screens: the Library becomes a two- or three-column grid; the recorder keeps its phone width */
  @media (min-width:900px) {
    .wrap { max-width:1180px; padding:0 32px 48px; }
    .tabs { max-width:420px; }
    #tab-record { max-width:560px; margin:0 auto; }
    #libBody { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:12px; align-items:start; }
    #libBody > .item { margin:0; height:100%; display:flex; flex-direction:column; }
    #libBody > .item .acts { margin-top:auto; padding-top:9px; }
    #libBody > .item .name { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    #libBody > .lib-note, #libBody > .lib-card, #libBody > .empty { grid-column:1 / -1; }
    .sheet { max-width:560px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>Voice capture</h1>
    <span class="chip off" id="acct">Not connected</span>
    <button class="icon-btn" id="gear" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div class="tabs" id="tabs"><button data-t="record" class="on">Record</button><button data-t="library">Library</button></div>
  <div class="notice" id="notice"><span id="noticeText"></span><button id="noticeBtn" hidden></button><button id="noticeX" aria-label="Dismiss">✕</button></div>

  <div class="tab on" id="tab-record">
  <section class="stage" id="stage">
    <div class="timer idle" id="timer">Tap to record</div>
    <div class="rec-wrap"><div class="ring" id="ring"></div><button class="rec" id="rec" aria-label="Start recording"><i></i></button></div>
    <div class="sub" id="sub">Recordings are kept on this phone until they reach Google Drive.</div>
  </section>

  <h2>Recordings <button id="syncBtn" hidden>Upload now</button></h2>
  <div class="list" id="list"></div>
  </div>
  <div class="tab" id="tab-library">
    <h2>Captions and notes <button id="libRefresh">Refresh</button></h2>
    <div id="libBody"><div class="empty">Loading…</div></div>
  </div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
